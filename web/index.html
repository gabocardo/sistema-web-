<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#800000">
<title>Bingo Chatunai</title>
<link rel="stylesheet" href="style.css">
<script src="config.js" defer>
</script>
<link rel="stylesheet" href="catalog.css">
<script src="vendor/qrcode.js" defer>
</script>
<script src="vendor/jsQR.js" defer>
</script>
<script src="catalog.js" defer>
</script>
<script src="report.js" defer>
</script>
<script src="interface.js" defer>
</script>
<script src="session.js" defer></script><script src="app.js" defer>
</script>
<script src="operations.js" defer></script>
</head>
<body>
<a class="skip" href="#content">Pular para o conteúdo</a>
<header>
<a href="./">Bingo Chatunai</a>
<span>Equipe do evento</span>
</header>
<main id="content" tabindex="-1">
<section class="panel" aria-labelledby="title">
<h1 id="title">Entrar</h1>
<div id="notice" role="status" aria-live="polite">
</div>
<form id="login">
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Senha</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit">Entrar</button>
</form>
<section id="account" hidden>
<p id="identity">
</p>
<nav id="nav" aria-label="Áreas de atendimento">
</nav>
<div id="desk"><aside id="lookup" aria-label="Localizar convite"></aside><div id="screen" tabindex="-1">
</div>
</div><button id="logout" type="button">Sair</button>
</section>
</section>
</main>
</body>
</html>
